<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | My Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <header class="auth-header container"><a class="brand" href="index.html"><span class="brand-mark">M</span>My Blog</a><a class="back-link" href="index.html">← Back to home</a></header>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="auth-icon">✦</div><p class="eyebrow">Welcome back</p><h1 id="login-title">Sign in to your account</h1>
      <p class="auth-subtitle">Continue sharing your ideas with the world.</p>
      <form id="login-form" class="form" novalidate>
        <div class="form-group"><label for="login-email">Email address</label><input id="login-email" name="email" type="email" placeholder="you@example.com" autocomplete="email"><small class="error-message"></small></div>
        <div class="form-group"><label for="login-password">Password</label><div class="password-field"><input id="login-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password"><button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button></div><small class="error-message"></small></div>
        <div class="form-options"><label class="check-label"><input type="checkbox" name="remember"><span>Remember me</span></label><a href="#forgot-password" class="text-link">Forgot password?</a></div>
        <button class="button button-primary button-full" type="submit">Login <span aria-hidden="true">→</span></button>
        <p class="form-success" aria-live="polite"></p>
      </form>
      <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
