<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Blogify Studio</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>

  <!-- Auth Controller & Password Validator -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/password-validator.js"></script>
</head>
<body style="display:grid; place-items:center; min-height:100vh; background: linear-gradient(135deg, #F8FAFC 0%, #ECFDF5 50%, #EFF6FF 100%); position:relative; overflow:hidden;">

  <!-- Decorative Floating Background Blobs -->
  <div style="position:absolute; top:-100px; right:-100px; width:300px; height:300px; border-radius:50%; background:rgba(16,185,129,0.15); filter:blur(60px); pointer-events:none;"></div>
  <div style="position:absolute; bottom:-100px; left:-100px; width:300px; height:300px; border-radius:50%; background:rgba(139,92,246,0.15); filter:blur(60px); pointer-events:none;"></div>

  <!-- Glassmorphic Auth Card Container -->
  <div style="width:min(100% - 32px, 420px); background:rgba(255, 255, 255, 0.88); backdrop-filter:blur(16px); border:1px solid rgba(226, 232, 240, 0.9); border-radius:var(--radius-xl); padding:40px; box-shadow:0 20px 50px rgba(15, 23, 42, 0.08); position:relative; z-index:10;">
    
    <div style="text-align:center; margin-bottom:28px;">
      <a class="brand" href="index.html" style="justify-content:center; margin-bottom:14px;">
        <span class="brand-icon">📖</span> Blogify
      </a>
      <h1 style="font-size:1.7rem; font-weight:800; color:var(--ink);">Welcome Back 👋</h1>
      <p style="color:var(--muted); font-size:0.86rem; margin-top:4px;">Log in to access your writer dashboard and stories.</p>
    </div>


    <!-- Error Message Display Box -->
    <div id="errorMessage" style="display:none; color:#DC2626; background:#FEE2E2; border:1px solid #FCA5A5; border-radius:10px; padding:10px 14px; margin-bottom:16px; font-size:0.84rem; font-weight:600;"></div>

    <form id="login-form" novalidate>
      <div class="form-field" style="margin-bottom:18px;">
        <label for="login-email">Email Address *</label>
        <input id="login-email" name="email" type="email" placeholder="john@blogify.com" required style="border-radius:10px; height:46px;">
      </div>

      <div class="form-field" style="margin-bottom:24px; position:relative;">
        <label for="login-password">Password *</label>
        <div style="position:relative; width:100%;">
          <input id="login-password" name="password" type="password" placeholder="••••••••" required style="border-radius:10px; height:46px; padding-right:40px; width:100%;">
          <button type="button" id="toggleLoginPassword" title="Show/Hide Password" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:1.1rem; border:none; background:none; cursor:pointer;">👁️</button>
        </div>
      </div>

      <button class="btn-green" type="submit" style="width:100%; height:48px; justify-content:center; font-size:0.95rem; font-weight:800; border-radius:12px;">Log In to Blogify →</button>
    </form>

    <div style="text-align:center; margin-top:24px; padding-top:20px; border-top:1px solid var(--line); font-size:0.86rem; color:var(--muted);">
      Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:700;">Sign Up Free</a>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/login.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
