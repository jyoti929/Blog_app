<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Details | Blogify</title>
  
  <!-- Google Fonts: Poppins, Inter, Roboto, Lora -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/create-blog.css">
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <nav class="navbar container">
      <a class="brand" href="index.html">
        <span class="brand-icon">📖</span> Blogify
      </a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
      </div>

      <div style="display:flex; align-items:center; gap:14px;">
        <button class="icon-btn theme-toggle-btn" title="Toggle Mode" style="width:36px; height:36px; border:1px solid var(--line); border-radius:8px;">🌙</button>
        <a class="btn-green" href="create-blog.html">+ New Blog</a>
      </div>
    </nav>
  </header>

  <!-- Main Container -->
  <main class="container" style="max-width: 1000px; padding: 40px 24px 80px;">
    
    <!-- Dynamic Blog Details Container (Receives Theme Styling Class) -->
    <div id="blog-details-container" class="blog-details-wrapper">
      <div style="text-align:center; padding:80px 0; color:var(--muted);">
        <span style="font-size:2rem; display:block; margin-bottom:12px;">⌛</span>
        <p>Loading blog details from server...</p>
      </div>
    </div>

  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>© 2026 Blogify. All rights reserved.</span>
      <a href="index.html" style="color:var(--primary); font-weight:600;">← Back to Home</a>
    </div>
  </footer>

  <!-- JavaScript Modules -->
  <script src="js/store.js"></script>
  <script src="js/script.js"></script>
  <script src="js/blog-details.js"></script>
</body>
</html>
