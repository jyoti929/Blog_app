<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | My Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <header class="auth-header container"><a class="brand" href="index.html"><span class="brand-mark">M</span>My Blog</a><a class="back-link" href="index.html">← Back to home</a></header>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="register-title">
      <div class="auth-icon">✦</div><p class="eyebrow">Start your journey</p><h1 id="register-title">Create your account</h1>
      <p class="auth-subtitle">Join a community that loves to learn, create, and share.</p>
      <form id="register-form" class="form" novalidate>
        <div class="form-group"><label for="register-name">Full name</label><input id="register-name" name="fullName" type="text" placeholder="Your full name" autocomplete="name"><small class="error-message"></small></div>
        <div class="form-group"><label for="register-email">Email address</label><input id="register-email" name="email" type="email" placeholder="you@example.com" autocomplete="email"><small class="error-message"></small></div>
        <div class="form-group"><label for="register-password">Password</label><div class="password-field"><input id="register-password" name="password" type="password" placeholder="At least 6 characters" autocomplete="new-password"><button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button></div><small class="error-message"></small></div>
        <div class="form-group"><label for="confirm-password">Confirm password</label><div class="password-field"><input id="confirm-password" name="confirmPassword" type="password" placeholder="Repeat your password" autocomplete="new-password"><button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button></div><small class="error-message"></small></div>
        <label class="check-label terms"><input id="terms" type="checkbox" name="terms"><span>I agree to the <a class="text-link" href="#terms">terms of use</a>.</span></label><small class="error-message terms-error"></small>
        <button class="button button-primary button-full" type="submit">Create account <span aria-hidden="true">→</span></button>
        <p class="form-success" aria-live="polite"></p>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
