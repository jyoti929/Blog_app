<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Blogify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Reusable Auth Manager -->
  <script src="js/auth.js"></script>
</head>
<body style="display:grid; place-items:center; min-height:100vh; background:var(--canvas);">

  <div style="width:min(100% - 32px, 440px); background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); padding:36px; box-shadow:var(--shadow-md);">
    <div style="text-align:center; margin-bottom:28px;">
      <a class="brand" href="index.html" style="justify-content:center; margin-bottom:12px;">
        <span class="brand-icon">📖</span> Blogify
      </a>
      <h1 style="font-size:1.6rem; font-weight:800;">Create your Account</h1>
      <p style="color:var(--muted); font-size:0.86rem; margin-top:4px;">Join Blogify to write, publish, and inspire.</p>
    </div>

    <!-- Error Message Display Box -->
    <div id="errorMessage" style="display:none; color:#DC2626; background:#FEE2E2; border:1px solid #FCA5A5; border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:0.84rem; font-weight:500;"></div>

    <form id="signup-form" novalidate>
      <div class="form-field" style="margin-bottom:16px;">
        <label for="signup-name">Full Name *</label>
        <input id="signup-name" name="name" type="text" placeholder="John Doe" required>
      </div>

      <div class="form-field" style="margin-bottom:16px;">
        <label for="signup-email">Email Address *</label>
        <input id="signup-email" name="email" type="email" placeholder="john@example.com" required>
      </div>

      <div class="form-field" style="margin-bottom:16px;">
        <label for="signup-password">Password *</label>
        <input id="signup-password" name="password" type="password" placeholder="At least 8 characters" required>
      </div>

      <div class="form-field" style="margin-bottom:24px;">
        <label for="signup-confirm">Confirm Password *</label>
        <input id="signup-confirm" name="confirm" type="password" placeholder="Repeat password" required>
      </div>

      <button class="btn-green" type="submit" style="width:100%; height:44px; justify-content:center;">Sign Up →</button>
    </form>

    <div style="text-align:center; margin-top:24px; padding-top:20px; border-top:1px solid var(--line); font-size:0.86rem; color:var(--muted);">
      Already have an account? <a href="login.html" style="color:var(--primary); font-weight:700;">Log In</a>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/register.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
